[package]
name = "glide"
version = "0.4.0"
edition = "2021"
description = "Low-latency software KVM: share one keyboard and mouse across computers"
default-run = "glide"

[lib]
path = "src/lib.rs"

# The desktop app. Double-click this one.
[[bin]]
name = "glide"
path = "src/bin/glide.rs"

# Headless command line: server / client / genkey / selftest.
[[bin]]
name = "glide-cli"
path = "src/bin/glide-cli.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
chacha20poly1305 = "0.10"
sha2 = "0.10"
# glow (OpenGL) instead of the default wgpu: far lighter for a small utility
# window. No system fonts: the built-in ones cover the UI.
eframe = { version = "0.37", default-features = false, features = ["glow", "accesskit", "clipboard", "default_fonts", "links", "wayland", "x11"] }
spake2 = "0.4"
local-ip-address = "0.6"
raw-window-handle = "0.6"
# Opus (the codec Discord and Zoom use) for sharing sound: libopus
# translated to Rust, so it builds without a C toolchain.
unsafe-libopus = "0.2"
miniz_oxide = "0.8"

# Tray icon: Windows and macOS for now. On Linux it needs GTK (or a
# StatusNotifier implementation); add it with the Linux backend.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.26"

[target.'cfg(windows)'.dependencies]
# For implementing a COM callback (`#[implement]` expands to `windows_core::`).
windows-core = "0.62"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinHttp",
    "Win32_Networking_WinSock",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# COM bindings for Windows audio (WASAPI), which windows-sys doesn't cover.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Benchmarks read per-thread CPU time (tests/cpu.rs).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_Foundation"] }
